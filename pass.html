<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="robots" content="noindex">
<meta property="og:title" content="Ghost Town: your pass">
<meta property="og:description" content="Show this at the door. Friday 30 October, dusk till midnight.">
<meta property="og:image" content="https://jinxednetwork.github.io/ghost-town/img/og.jpg">
<title>Ghost Town Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=IM+Fell+English:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Same look as pay.html. The pass itself is the QR: pass.html#<pass_token>. */
  :root {
    --night: #070707; --ash: #141312; --bone: #ece8e1; --bone-dim: #a39d94; --smoke: #6f6a63; --line: #2c2926;
    --blood: #c8241a; --blood-hi: #e2352a; --ok: #7fa88a;
    --f-black: "UnifrakturMaguntia", "Old English Text MT", serif;
    --f-body: "IM Fell English", "Iowan Old Style", Georgia, serif;
    --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--night); -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--night); color: var(--bone); font: 18px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
  .grain { position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .45; background: url(img/grain.png); }
  .wrap { max-width: 460px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top, 0px)) 16px calc(48px + env(safe-area-inset-bottom, 0px)); }
  .mono { font: 400 12px/1.6 var(--f-mono); letter-spacing: .22em; text-transform: uppercase; color: var(--bone-dim); }
  .red { color: var(--blood-hi); }
  a { color: var(--bone); }
  :focus-visible { outline: 2px solid var(--blood-hi); outline-offset: 3px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .logos { display: flex; align-items: center; gap: 10px; opacity: .72; }
  .logos img { width: auto; } .lg-ref { height: 26px; } .lg-jx { height: 18px; }
  .x { font: 400 12px var(--f-mono); color: var(--smoke); }
  h1 { margin: 30px 0 0; text-align: center; font: 400 clamp(60px, 17vw, 88px)/.9 var(--f-black); color: #f2eee8; }
  .when { text-align: center; margin-top: 10px; }
  .pass { margin-top: 26px; border: 1.5px dashed var(--blood); background: rgba(200,36,26,.06); padding: 24px 20px; text-align: center; }
  .pass.wait { border-color: var(--smoke); background: transparent; }
  .admit { font: 500 14px var(--f-mono); letter-spacing: .3em; text-transform: uppercase; color: var(--blood-hi); }
  .qr { display: block; width: min(250px, 70vw); height: auto; margin: 16px auto; background: #fff; image-rendering: pixelated; }
  .code { font: 500 clamp(36px, 11vw, 50px)/1 var(--f-mono); letter-spacing: .06em; margin: 6px 0; }
  .who { font: 400 24px/1.25 var(--f-body); }
  .with { margin-top: 6px; font: italic 18px/1.45 var(--f-body); color: #d6d1c9; }
  .inside { margin-top: 12px; }
  .rules { margin: 18px auto 0; max-width: 32ch; font: italic 16px/1.5 var(--f-body); color: var(--bone-dim); }
  .msg { font: italic 19px/1.5 var(--f-body); color: #d6d1c9; margin: 0; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .btn { display: flex; align-items: center; justify-content: center; min-height: 54px; padding: 0 12px; border: 1px solid var(--line); background: var(--ash); color: var(--bone); font: 500 12px var(--f-mono); letter-spacing: .16em; text-transform: uppercase; cursor: pointer; text-decoration: none; }
  .btn.main { background: var(--blood); border-color: var(--blood); }
  .help { margin-top: 30px; text-align: center; font: italic 16px/1.6 var(--f-body); color: var(--bone-dim); }
  .help a { white-space: nowrap; }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--bone); color: var(--night); font: 500 12px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; padding: 10px 16px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<main class="wrap">
  <div class="top">
    <div class="logos"><img class="lg-ref" src="img/ref.png" alt="References"><span class="x">&times;</span><img class="lg-jx" src="img/jinxed.png" alt="Jinxed"></div>
    <span class="mono">Fri 30 Oct</span>
  </div>
  <h1>Ghost Town</h1>
  <div class="mono when">Dusk till midnight</div>

  <div class="pass wait" id="pass"><p class="msg" id="msg">Opening your pass&hellip;</p></div>

  <div class="acts" id="acts" hidden>
    <button class="btn main" type="button" id="save">Save pass</button>
    <button class="btn" type="button" id="share">Share</button>
  </div>

  <p class="help">Trouble? WhatsApp or call <a href="tel:+919819196888">+91 98191 96888</a><br>or email <a href="mailto:ian@jinxednetwork.com">ian@jinxednetwork.com</a></p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/qrcode.js"></script>
<script>
const SUPABASE_URL = "https://gwwiljdhsojlpdsqqxab.supabase.co";
const SUPABASE_KEY = "sb_publishable_D5U449KkkGPhjupJ0s5Yfw_wiqGKCD0";
const $ = (id) => document.getElementById(id);
const token = location.hash.slice(1).toLowerCase();
const link = location.origin + location.pathname + "#" + token;
let saveUrl = null;

function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1800); }
function say(t) { $("pass").className = "pass wait"; $("pass").replaceChildren(Object.assign(document.createElement("p"), { className: "msg", textContent: t })); }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function qrCanvas(text) {
  const q = qrcode(0, "M"); q.addData(text); q.make();
  const n = q.getModuleCount(), cell = 10, pad = 4 * cell, size = n * cell + pad * 2;
  const c = document.createElement("canvas"); c.width = size; c.height = size;
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, size, size); x.fillStyle = "#000";
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect(pad + k * cell, pad + r * cell, cell, cell);
  return c;
}

function render(p) {
  if (p.status !== "Paid") return say(p.status === "Pending" ? "Your payment is still being checked. This page turns into your pass once it clears." : "This pass isn't active. Message us and we'll sort it out.");
  const qr = qrCanvas(link);
  const box = $("pass"); box.className = "pass"; box.textContent = "";
  const img = el("img", "qr"); img.src = qr.toDataURL("image/png"); img.alt = "Entry QR code for " + p.code;
  box.append(el("div", "admit", "Admit " + p.passes), img, el("div", "code", p.code), el("div", "who", p.name));
  if (p.guests && p.guests.length) box.append(el("div", "with", "with " + p.guests.join(", ")));
  if (p.checked_in) box.append(el("div", "mono inside red", p.checked_in + " of " + p.passes + " already inside"));
  box.append(el("p", "rules", "Show this at the door with photo ID. Costume compulsory. One QR covers everyone on it."));
  $("acts").hidden = false;

  // Image for the gallery: same pass on a dark card.
  const W = qr.width + 160, H = qr.width + 420, s = document.createElement("canvas"); s.width = W; s.height = H;
  const y = s.getContext("2d"); y.fillStyle = "#070707"; y.fillRect(0, 0, W, H); y.textAlign = "center";
  y.fillStyle = "#ece8e1"; y.font = "80px UnifrakturMaguntia, serif"; y.fillText("Ghost Town", W / 2, 110);
  y.fillStyle = "#a39d94"; y.font = "24px 'IBM Plex Mono', monospace"; y.fillText("FRI 30 OCT · DUSK TILL MIDNIGHT", W / 2, 154);
  y.drawImage(qr, 80, 190);
  y.fillStyle = "#e2352a"; y.font = "500 28px 'IBM Plex Mono', monospace"; y.fillText("ADMIT " + p.passes, W / 2, qr.width + 250);
  y.fillStyle = "#ece8e1"; y.font = "500 52px 'IBM Plex Mono', monospace"; y.fillText(p.code, W / 2, qr.width + 315);
  y.font = "34px 'IM Fell English', serif"; y.fillText(p.name, W / 2, qr.width + 365);
  saveUrl = s.toDataURL("image/png");
}

$("save").onclick = () => { const a = document.createElement("a"); a.href = saveUrl; a.download = "ghost-town-pass.png"; document.body.append(a); a.click(); a.remove(); toast("Saved"); };
$("share").onclick = async () => {
  if (navigator.share) { try { await navigator.share({ title: "Ghost Town pass", text: "Our Ghost Town pass. Show the QR at the door.", url: link }); } catch (e) {} }
  else { try { await navigator.clipboard.writeText(link); toast("Link copied"); } catch (e) { prompt("Copy your pass link", link); } }
};

(async () => {
  if (!/^[0-9a-f-]{36}$/.test(token)) return say("This link is missing its pass. Open the link we sent you on WhatsApp, or check your pass on the payment page.");
  try {
    await document.fonts.ready;
    const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/get_pass", { method: "POST", headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ p_pass: token }) });
    if (!res.ok) throw new Error(res.status);
    const rows = await res.json();
    if (!rows.length) return say("We can't find this pass. Check the link, or message us.");
    render(rows[0]);
  } catch (e) { console.error(e); say("Couldn't reach the house. Check your connection and reload."); }
})();
</script>
</body>
</html>
